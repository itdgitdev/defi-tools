[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-configured-pool-rebalancer"
version = "0.1.0"
requires-python = ">=3.13"
description = "Standalone configured V3 pool rebalancer and compounder"

[tool.setuptools.packages.find]
where = ["src"]
